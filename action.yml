name: RepoAccord
description: Repository automation, aligned with your rules.
inputs:
  token:
    description: Token used to create issues and pull requests; must not be the default GITHUB_TOKEN if you want CI to run on the PR
    required: true
  config-path:
    description: Path to the RepoAccord configuration file
    default: .github/repoaccord.yml
  dry-run:
    description: Run without performing actions
    default: "true"
runs:
  using: composite
  steps:
    # This action is not released yet.
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"
    - name: Install RepoAccord
      run: python -m pip install .
      shell: bash
      working-directory: ${{ github.action_path }}
    - name: Run RepoAccord
      run: python -m repoaccord
      shell: bash
      env:
        REPOACCORD_TOKEN: ${{ inputs.token }}
        REPOACCORD_CONFIG_PATH: ${{ inputs.config-path }}
        REPOACCORD_DRY_RUN: ${{ inputs.dry-run }}
        GITHUB_API_URL: ${{ env.GITHUB_API_URL }}
