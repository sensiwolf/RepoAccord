# RepoAccord configuration example.
version: 1
branches:
  prefixes:
    - feat/
    - fix/
    - docs/
    - chore/
actors:
  allow: []
issues:
  label: null
  template: null
  assignees: []
  # Example: assignees: [release-manager]
pull_request:
  placeholder: "#<issue number>"
  reviewers: []
  assignees: []
  labels: []
  # Example:
  # reviewers: [maintainer]
  # assignees: [release-manager]
  # labels: [needs-review]
trailers:
  forbid: []
  # Example: explicitly reject these phrases.
  # forbid:
  #   - "Co-authored-by"
  #   - "Generated with"
auto_merge:
  enabled: false
  method: merge
