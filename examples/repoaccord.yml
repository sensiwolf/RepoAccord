# Draft configuration example; schema is still pre-release.
version: 1
branches:
  prefixes:
    - feat/
    - fix/
    - docs/
    - chore/
actors:
  allow: []
issues:
  label: null
  template: null
pull_request:
  placeholder: "#<issue number>"
trailers:
  forbid:
    - Co-authored-by
    - Generated with
auto_merge:
  enabled: false
  method: merge
