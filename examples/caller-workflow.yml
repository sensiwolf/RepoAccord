# Example caller workflow.
name: RepoAccord
on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
permissions:
  contents: read
concurrency:
  group: repoaccord-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repoaccord:
    runs-on: ubuntu-latest
    steps:
      # For real repositories, pin a release tag or full commit SHA.
      - uses: sensiwolf/repoaccord@v0.1.0
        with:
          token: ${{ secrets.REPOACCORD_TOKEN }}
          dry-run: ${{ vars.REPOACCORD_DRY_RUN || 'true' }}
